<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TVCompany Local</title><link rel="stylesheet" href="style.css"></head><body><header><h1>TVCompany</h1><nav><a href="index.html">Admin</a><a href="display.html">Display</a></nav></header><main><section class="panel"><h2>Content Manager</h2><p>Stored only in this browser on this device. No cloud database.</p><form id="editor"><label>Type <select id="type"><option value="image">Image</option><option value="video">Video</option><option value="news">News</option><option value="external">External website</option></select></label><label>Title <input id="title" maxlength="160" required></label><label id="fileRow">Image / video <input id="file" type="file" accept="image/*,video/*"></label><label id="bodyRow" hidden>News text <textarea id="body" rows="4"></textarea></label><label id="urlRow" hidden>Website URL <input id="url" type="url" placeholder="https://example.com"></label><label>Duration (seconds) <input id="duration" type="number" min="2" max="3600" value="15" required></label><label>Order <input id="sort" type="number" min="0" value="0" required></label><button type="submit">Add content</button></form><p id="status" role="status"></p></section><section class="panel"><h2>Saved content</h2><div id="items"></div><div class="actions"><button id="export">Export backup</button><label class="import">Import backup <input id="import" type="file" accept=".json,application/json"></label><button id="persist">Request persistent storage</button></div><p class="muted">Exported backups include media as base64 and may be very large. Keep a copy outside the browser.</p></section></main><script src="db.js"></script><script src="admin.js"></script></body></html>
